# Construye Instalar_LaPampa.exe en la nube (Windows). Se dispara a mano o al subir una etiqueta vX.Y
name: Instalador de Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Programa (PyInstaller)
        run: |
          python -m pip install flask openpyxl pyxlsb pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LaPampa --icon icono.ico --hidden-import openpyxl --hidden-import pyxlsb --add-data "templates;templates" app.py
      - name: Instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar_LaPampa
          path: Instalador/Instalar_LaPampa.exe
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" Instalador/Instalar_LaPampa.exe --title "La Pampa ${{ github.ref_name }}" --notes "Instalador para Windows. Se instala encima de la versión anterior sin tocar los datos (AppData\Local\LaPampa)."
